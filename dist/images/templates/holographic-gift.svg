<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0b" />
      <stop offset="100%" stop-color="#161616" />
    </linearGradient>
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7eb9" />
      <stop offset="33%" stop-color="#ff7f50" />
      <stop offset="66%" stop-color="#7afcff" />
      <stop offset="100%" stop-color="#e0c3fc" />
    </linearGradient>
  </defs>
  <rect width="240" height="180" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="239" height="179" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Shallow wide gift box -->
  <g transform="translate(0, 15)">
    <path d="M60,75 L120,50 L180,75 L120,100 Z" fill="#fcfcfc" stroke="#dcdcdc" stroke-width="1.5"/>
    <path d="M60,75 L60,95 L120,120 L120,100 Z" fill="#f0f0f0" stroke="#dcdcdc" stroke-width="1.5"/>
    <path d="M120,100 L120,120 L180,95 L180,75 Z" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.5"/>
    
    <!-- Holographic Foil Pattern -->
    <path d="M75,70 L120,51 L165,70 L120,89 Z" fill="url(#holoGrad)" opacity="0.4" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <text x="120" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="url(#holoGrad)" text-anchor="middle" letter-spacing="1.5">
    GIFT BOX · HOLOGRAPHIC
  </text>
</svg>
